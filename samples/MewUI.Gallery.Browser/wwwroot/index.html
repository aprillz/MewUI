<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" content="notranslate">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#202124">
  <link rel="icon" type="image/png" href="./favicon-256.png">
  <link rel="apple-touch-icon" href="./favicon-256.png">
  <title>MewUI Gallery Browser First Boot</title>
  <style>
    html, body, canvas { width: 100%; height: 100%; margin: 0; overflow: hidden; display: block; }
    /* The app owns every gesture inside the canvas. Without this the browser claims a touch drag
       for panning, then fires pointercancel and the drag is lost partway through. */
    canvas { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { overscroll-behavior: none; }
    /* Only visible until the first frame; matching the scheme avoids a dark flash on a light page. */
    body { background: #ffffff; }
    @media (prefers-color-scheme: dark) { body { background: #202124; } }
    /* Sized so a boot failure's message stays readable on a phone instead of one clipped line. */
    #status { position: fixed; right: 8px; bottom: 8px; padding: 4px 7px; color: white;
      background: rgba(0, 0, 0, .65); font: 12px sans-serif; pointer-events: none;
      max-width: min(80vw, 640px); white-space: pre-wrap; word-break: break-word; }
    /* Kept on-screen and sized so the browser still treats it as a live IME target, and moved onto
       the caret by main.js so the IME draws its candidates there. A width the pre-edit fits in is
       what lets the browser lay its own composition UI out; pointer-events keeps the box, which
       covers part of the canvas, from taking a click meant for the app. */
    #textinput { position: fixed; top: 0; left: 0; width: 200px; height: 1px; opacity: 0;
      pointer-events: none; border: 0; padding: 0; outline: none; background: transparent;
      color: transparent; }
  </style>
</head>
<body class="notranslate">
  <canvas id="canvas"></canvas>
  <input id="textinput" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  <div id="status">Starting MewUI WASM...</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
