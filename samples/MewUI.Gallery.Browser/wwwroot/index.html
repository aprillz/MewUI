<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" content="notranslate">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#202124">
  <link rel="icon" type="image/png" href="./favicon-256.png">
  <link rel="apple-touch-icon" href="./favicon-256.png">
  <title>MewUI Gallery Browser First Boot</title>
  <style>
    html, body, canvas { width: 100%; height: 100%; margin: 0; overflow: hidden; display: block; }
    /* The app owns every gesture inside the canvas. Without this the browser claims a touch drag
       for panning, then fires pointercancel and the drag is lost partway through. */
    canvas { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { overscroll-behavior: none; }
    /* Only visible until the first frame; matching the scheme avoids a dark flash on a light page. */
    body { background: #ffffff; }
    @media (prefers-color-scheme: dark) { body { background: #202124; } }
    /* Drawn by the page itself so it shows on the first paint, before the runtime has downloaded. */
    #loader { --loader-fg: #7a6aa8; --loader-track: #ece6fb; --loader-bar: linear-gradient(90deg, #b19dfa, #dcc1fd);
      --loader-error: #c0475e;
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 27px; background: inherit; transition: opacity .35s ease; }
    @media (prefers-color-scheme: dark) {
      #loader { --loader-fg: #b8aee0; --loader-track: #342f45; --loader-bar: linear-gradient(90deg, #a18aed, #cfccfd); }
    }
    #loader.done { opacity: 0; pointer-events: none; }
    #loader img { width: 96px; height: 96px; animation: loader-breathe 1.6s ease-in-out infinite; }
    #loader .track { width: 222px; height: 6px; border-radius: 3px; background: var(--loader-track); overflow: hidden; }
    #loader .bar { width: 0; height: 100%; border-radius: inherit; background: var(--loader-bar); transition: width .25s ease; }
    #loader .stage { color: var(--loader-fg); font: 18px system-ui, sans-serif; letter-spacing: .02em;
      max-width: min(80vw, 480px); text-align: center; white-space: pre-wrap; word-break: break-word; }
    #loader.failed img { animation: none; opacity: .5; }
    #loader.failed .bar { background: var(--loader-error); }
    #loader.failed .stage { color: var(--loader-error); }
    @keyframes loader-breathe { 50% { transform: scale(.94); opacity: .8; } }
    @media (prefers-reduced-motion: reduce) { #loader img { animation: none; } }
    /* Reports a frame failure after the loader has gone; sized so it stays readable on a phone. */
    #status { position: fixed; right: 8px; bottom: 8px; padding: 4px 7px; color: white;
      background: rgba(0, 0, 0, .65); font: 12px sans-serif; pointer-events: none;
      max-width: min(80vw, 640px); white-space: pre-wrap; word-break: break-word; }
    /* Kept on-screen and sized so the browser still treats it as a live IME target, and moved onto
       the caret by main.js so the IME draws its candidates there. A width the pre-edit fits in is
       what lets the browser lay its own composition UI out; pointer-events keeps the box, which
       covers part of the canvas, from taking a click meant for the app. */
    #textinput { position: fixed; top: 0; left: 0; width: 200px; height: 1px; opacity: 0;
      pointer-events: none; border: 0; padding: 0; outline: none; background: transparent;
      color: transparent; }
  </style>
</head>
<body class="notranslate">
  <canvas id="canvas"></canvas>
  <input id="textinput" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  <div id="loader" role="progressbar" aria-label="Loading MewUI Gallery" aria-valuemin="0" aria-valuemax="100">
    <img src="./logo.svg" alt="" width="96" height="96">
    <div class="track"><div class="bar"></div></div>
    <div class="stage">Loading .NET runtime</div>
  </div>
  <div id="status" hidden></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
