name: Deploy site (GitHub Pages)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Publish browser Gallery
        run: >
          dotnet publish samples/MewUI.Gallery.Browser/MewUI.Gallery.Browser.csproj
          -c Release
          -p:RunAOTCompilation=true
          -p:MewUITargetFrameworks=net10.0

      # Served from a subfolder, so the app is reachable at <pages root>/Gallery.
      - name: Stage the Gallery
        run: |
          mkdir -p site/Gallery
          cp -r samples/MewUI.Gallery.Browser/bin/Release/net10.0/publish/wwwroot/. site/Gallery/
          # The .NET assets carry a content hash in their file names, but main.js does not, and
          # Pages serves it with a four hour max-age. Stamping the commit gives it a fresh URL
          # per deploy, so a cached loader can never pair with newly published assets.
          sed -i "s|\./main\.js|./main.js?v=${GITHUB_SHA::8}|" site/Gallery/index.html
          grep -q 'main.js?v=' site/Gallery/index.html

      - name: Upload Gallery artifact
        uses: actions/upload-artifact@v4
        with:
          name: gallery
          path: site/Gallery
          if-no-files-found: error

  # Windows: the pack script runs there and the package list has Windows-only projects.
  api-docs:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore xmldocmd
        working-directory: tools/docs
        run: dotnet tool restore

      # Generates every package under .artifacts/api-build and stages the assemblies listed in
      # tools/docs/publish-scope.json under .artifacts/api with version.txt (MewUIVersion + commit).
      - name: Build API reference
        shell: cmd
        run: tools\docs\build_api_docs.cmd

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api
          path: .artifacts/api
          if-no-files-found: error

  # Pages replaces the whole site per deploy, so the docs site, the API reference and the Gallery
  # are staged into one artifact: website/dist is the site root, the API pages are built into it
  # by Starlight, and the Gallery is copied to site/Gallery untouched.
  deploy:
    needs: [gallery, api-docs]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Download API reference
        uses: actions/download-artifact@v4
        with:
          name: api
          path: website/src/content/docs/api

      - name: Build the docs site
        working-directory: website
        run: |
          npm ci
          npm run build
          npm run check-links

      - name: Download Gallery
        uses: actions/download-artifact@v4
        with:
          name: gallery
          path: website/dist/Gallery

      - name: Stage the site
        run: |
          mkdir -p site
          cp -R website/dist/. site/
          # Pages runs Jekyll by default, which drops the _framework folder.
          touch site/.nojekyll
          grep -q 'main.js?v=' site/Gallery/index.html
          test -f site/api/index.html
          test -f site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
