name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build and test on Windows: the WebView2 package only targets net10.0-windows, and the fluent
  # coverage tests audit the built extension assemblies next to the core.
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # The audit tests in tests/MewUI.Test read these Debug outputs when they exist, so they are
      # built first; otherwise those assemblies would silently be skipped.
      - name: Build audited extension assemblies
        run: |
          dotnet build extensions/MewUI.Skia/MewUI.Skia.csproj -c Debug -f net10.0 /nr:false
          dotnet build extensions/MewUI.WebView2.Win32/MewUI.WebView2.Win32.csproj -c Debug -f net10.0-windows /nr:false
          dotnet build extensions/MewUI.MewCharts/MewUI.MewCharts.csproj -c Debug -f net10.0 /nr:false

      # The core suite also holds rendering and font tests that need the fonts and GPU paths of a
      # desktop machine; on the hosted runner they fail for environment reasons, so this job runs
      # the markup governance gates (fluent coverage, hints, reference drift, XML coverage, Starlight
      # post-processing) and leaves the rendering suites to local runs.
      - name: Test core markup gates
        run: dotnet test tests/MewUI.Test/MewUI.Test.csproj -f net10.0 /nr:false --filter "FullyQualifiedName~FluentExtensionAudit|FullyQualifiedName~MarkupReferenceDocs|FullyQualifiedName~FluentExtensionCoverage|FullyQualifiedName~MarkupDocCoverage|FullyQualifiedName~ApiStarlightWriter"

      - name: Test analyzers and generators
        run: |
          dotnet test tests/MewUI.Analyzers.Test/MewUI.Analyzers.Test.csproj /nr:false
          dotnet test tests/MewUI.Generators.Test/MewUI.Generators.Test.csproj /nr:false

      - name: Test extension packages
        run: |
          dotnet test tests/MewUI.Geometry.Test/MewUI.Geometry.Test.csproj -f net10.0 /nr:false
          dotnet test tests/MewUI.Svg.Test/MewUI.Svg.Test.csproj -f net10.0 /nr:false
          dotnet test tests/MewUI.Markdown.Test/MewUI.Markdown.Test.csproj -f net10.0 /nr:false
          dotnet test tests/MewUI.MewDock.Test/MewUI.MewDock.Test.csproj -f net10.0 /nr:false
          dotnet test tests/MewUI.Terminal.Test/MewUI.Terminal.Test.csproj -f net10.0 /nr:false
          dotnet test tests/MewUI.MewvalonEdit.Test/MewUI.MewvalonEdit.Test.csproj -f net10.0 /nr:false

      - name: Restore xmldocmd
        working-directory: tools/docs
        run: dotnet tool restore

      # Dry run of the API reference for the core: xmldocmd fails on broken cref targets and
      # malformed XML. Nothing is uploaded; pages.yml publishes.
      - name: API reference dry run
        shell: cmd
        run: tools\docs\build_api_docs.cmd MewUI

      # Input for the documentation review (plan 7.5): the public members declared in files that
      # changed against main, with their summaries and fluent counterparts side by side.
      - name: Extract changed members for review
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .artifacts | Out-Null
          dotnet run --project tools/MewUI.MarkupAudit/MewUI.MarkupAudit -c Release --no-build -- src/MewUI/bin/Release/net10.0/Aprillz.MewUI.dll --doc-review Aprillz.MewUI --changed-since origin/main > .artifacts/doc-review-changed.md
          dotnet run --project tools/MewUI.MarkupAudit/MewUI.MarkupAudit -c Release --no-build -- src/MewUI/bin/Release/net10.0/Aprillz.MewUI.dll --doc-review Aprillz.MewUI.Controls --changed-since origin/main >> .artifacts/doc-review-changed.md
        continue-on-error: true

      - name: Upload review extract
        uses: actions/upload-artifact@v4
        with:
          name: doc-review-changed
          path: .artifacts/doc-review-changed.md
          if-no-files-found: ignore

  # The documentation site must build from the committed docs, and every internal link it renders
  # must resolve. The API tree is absent here, so links into it are skipped by the checker.
  site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build the docs site
        working-directory: website
        run: |
          npm ci
          npm run build
          npm run check-links

      # External links in the documentation sources. Remote sites come and go, so a broken external
      # link is reported in the job summary and as an artifact without failing the run.
      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --scheme https --scheme http --exclude-path website/src/content/docs/api --max-retries 2 --accept 200..299,403,429 'docs/**/*.md' 'website/src/content/docs/**/*.mdx' 'README.md' 'README.ko.md'
          fail: false
          output: .artifacts/lychee-report.md

      - name: Upload external link report
        if: steps.lychee.outputs.exit_code != 0
        uses: actions/upload-artifact@v4
        with:
          name: external-links
          path: .artifacts/lychee-report.md
          if-no-files-found: ignore
